name: Repository navigation contract

on:
  pull_request:
    paths:
      - "README.md"
      - "CLAUDE.md"
      - "CURRENT_STATE.md"
      - "ARCHITECTURE.md"
      - "ROADMAP.md"
      - "docs/**"
      - "scripts/check-repository-navigation.py"
      - "scripts/check-repository-taxonomy.py"
      - ".github/workflows/repository-navigation-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-navigation:
    name: Human and AI onboarding contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository navigation
        run: python3 scripts/check-repository-navigation.py

      - name: Verify repository taxonomy and links
        run: python3 scripts/check-repository-taxonomy.py
