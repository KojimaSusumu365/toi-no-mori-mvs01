name: PLM Fresh Source Pool Build

on:
  push:
    branches: [plm-fresh-sourcepool-runner-20260823]
    paths: ['.github/workflows/plm-fresh-sourcepool-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build three-domain blind source pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out
          python - <<'PY'
          import csv, hashlib, json, os, re, subprocess, urllib.request, unicodedata
          from pathlib import Path
          from collections import Counter
          from datetime import datetime, timezone

          OUT=Path('work/out')
          ACQ=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          TARGET=650  # oversupply each domain; frozen sampler later selects >=500 docs

          def canon(s):
              s=unicodedata.normalize('NFKC',s or '')
              s=s.replace('\r\n','\n').replace('\r','\n')
              s=re.sub(r'[ \t\u3000]+',' ',s)
              s=re.sub(r'\n{3,}','\n\n',s)
              return s.strip()
          def sha(s): return hashlib.sha256(canon(s).encode()).hexdigest()
          def ja_chars(s): return len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',s))
          def sentenceish(s): return len(re.findall(r'[。！？!?]',s))
          def usable(s):
              s=canon(s)
              return len(s)>=350 and ja_chars(s)>=120 and sentenceish(s)>=4
          def simhash(s):
              toks=re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶA-Za-z0-9]{2,}',canon(s))
              if not toks: return 0
              v=[0]*64
              for t in toks:
                  h=int(hashlib.sha256(t.encode()).hexdigest()[:16],16)
                  for i in range(64): v[i]+=1 if (h>>i)&1 else -1
              return sum((1<<i) for i,x in enumerate(v) if x>=0)
          def hd(a,b): return (a^b).bit_count()

          rows=[]; audit=[]; seen_sha={}; sims=[]
          def add(domain,did,text,uri):
              text=canon(text)
              if not usable(text):
                  audit.append({'document_id':did,'domain':domain,'status':'REJECT_SHORT_OR_NONJP'}); return False
              h=sha(text)
              if h in seen_sha:
                  audit.append({'document_id':did,'domain':domain,'status':'REJECT_EXACT_DUP','duplicate_of':seen_sha[h]}); return False
              sh=simhash(text)
              # near-duplicate audit within same domain; conservative Hamming <=2
              for odom,odid,osh in sims:
                  if odom==domain and hd(sh,osh)<=2:
                      audit.append({'document_id':did,'domain':domain,'status':'REJECT_NEAR_DUP_SIMHASH','duplicate_of':odid}); return False
              seen_sha[h]=did; sims.append((domain,did,sh))
              rows.append({'document_id':did,'domain':domain,'text':text,'source_uri':uri,'acquired_at':ACQ,'source_sha256':h})
              return True

          # PUBLIC: Japanese government FAQ collection. Only question+answer text; metadata labels are not retained.
          pub_url='https://huggingface.co/datasets/matsuxr/JaGovFaqs-22k/resolve/main/data.jsonl?download=true'
          pub_path=Path('work/jagov.jsonl')
          urllib.request.urlretrieve(pub_url,pub_path)
          with pub_path.open(encoding='utf-8') as f:
              for idx,line in enumerate(f):
                  if sum(r['domain']=='PUBLIC' for r in rows)>=TARGET: break
                  try:o=json.loads(line)
                  except: continue
                  lower={str(k).lower():v for k,v in o.items()}
                  q=next((lower[k] for k in lower if k in ('question','query','prompt','q')), '')
                  a=next((lower[k] for k in lower if k in ('answer','response','completion','a')), '')
                  if not isinstance(q,str): q=str(q)
                  if not isinstance(a,str): a=str(a)
                  text=(q+'。\n'+a).strip()
                  src=next((lower[k] for k in lower if k in ('url','source','source_url','copyright')), '')
                  uri=str(src) if src else f'{pub_url}#row={idx}'
                  add('PUBLIC',f'PUB-JAGOV-{idx:06d}',text,uri)

          # CORPORATE: EDINET-derived annual securities report text, BusinessRisks only.
          subprocess.run(['git','clone','--depth','1','https://github.com/yuukimiyo/stdata-jp.git','work/stdata'],check=True,stdout=subprocess.DEVNULL)
          corp_files=sorted(Path('work/stdata').glob('*/*/2023/BusinessRisks'),key=lambda p: hashlib.sha256(str(p).encode()).hexdigest())
          for p in corp_files:
              if sum(r['domain']=='CORPORATE' for r in rows)>=TARGET: break
              try:text=p.read_text(encoding='utf-8',errors='ignore')
              except: continue
              rel=p.relative_to('work/stdata').as_posix()
              code=rel.split('/')[1]
              add('CORPORATE',f'CORP-EDINET-{code}-2023-BR',text,f'https://github.com/yuukimiyo/stdata-jp/blob/main/{rel}')

          # GENERAL_TECH: Japanese MDN Web Docs translations (CC licensed project).
          subprocess.run(['git','clone','--depth','1','https://github.com/mdn/translated-content.git','work/mdn'],check=True,stdout=subprocess.DEVNULL)
          tech_files=sorted(Path('work/mdn/files/ja/web').rglob('index.md'),key=lambda p: hashlib.sha256(str(p).encode()).hexdigest())
          front=re.compile(r'^---\n.*?\n---\n',re.S)
          for p in tech_files:
              if sum(r['domain']=='GENERAL_TECH' for r in rows)>=TARGET: break
              try:text=p.read_text(encoding='utf-8',errors='ignore')
              except: continue
              text=front.sub('',text)
              # strip obvious markdown/HTML boilerplate without semantic filtering
              text=re.sub(r'```.*?```',' ',text,flags=re.S)
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\{\{[^}]+\}\}',' ',text)
              text=re.sub(r'\[([^\]]+)\]\([^\)]+\)',r'\1',text)
              text=re.sub(r'^[#>*-]+\s*','',text,flags=re.M)
              rel=p.relative_to('work/mdn').as_posix()
              add('GENERAL_TECH','TECH-MDN-'+hashlib.sha256(rel.encode()).hexdigest()[:16],text,f'https://github.com/mdn/translated-content/blob/main/{rel}')

          counts=Counter(r['domain'] for r in rows)
          status='PASS_SOURCE_POOL_OVERSUPPLIED' if all(counts[d]>=TARGET for d in ['PUBLIC','CORPORATE','GENERAL_TECH']) else 'BLOCKED_INSUFFICIENT_SOURCE_DOCUMENTS'
          # Deterministic row order by domain then document ID hash.
          rows.sort(key=lambda r:(r['domain'],hashlib.sha256(r['document_id'].encode()).hexdigest(),r['document_id']))
          tsv=OUT/'FRESH_SOURCE_POOL.tsv'
          with tsv.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['document_id','domain','text','source_uri','acquired_at','source_sha256'],delimiter='\t',lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          (OUT/'SOURCE_POOL_DUPLICATE_AUDIT.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          manifest={
            'stage':'IF-0R4 three-domain independent Fresh source-pool construction',
            'status':status,'gold_accessed':False,'model_scores_used':False,'candidate_marker_filtering_used':False,
            'counts':dict(counts),'target_oversupply_per_domain':TARGET,'total_documents':len(rows),
            'source_pool_sha256':hashlib.sha256(tsv.read_bytes()).hexdigest(),
            'sources':{
              'PUBLIC':{'name':'matsuxr/JaGovFaqs-22k','uri':pub_url},
              'CORPORATE':{'name':'yuukimiyo/stdata-jp / 2023 BusinessRisks','uri':'https://github.com/yuukimiyo/stdata-jp','note':'EDINET-derived annual securities-report text; excludes Kessan corpus source family'},
              'GENERAL_TECH':{'name':'MDN translated-content Japanese Web docs','uri':'https://github.com/mdn/translated-content'}},
            'near_duplicate_rule':'exact canonical SHA-256 + same-domain 64-bit token SimHash Hamming <= 2',
            'construction_time_utc':ACQ}
          (OUT/'SOURCE_POOL_BUILD_STATUS.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          # copyright-safe redistributable index: no source text, but complete reconstructable provenance/hashes
          with (OUT/'FRESH_SOURCE_POOL_INDEX_NO_TEXT.tsv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t',lineterminator='\n');w.writerow(['document_id','domain','source_uri','acquired_at','source_sha256'])
              for r in rows:w.writerow([r[k] for k in ['document_id','domain','source_uri','acquired_at','source_sha256']])
          (OUT/'RAW_TEXT_NOT_FOR_REDISTRIBUTION.md').write_text('Raw FRESH_SOURCE_POOL.tsv is produced only as an ephemeral workflow artifact for research execution. The portable package should distribute the no-text index plus reconstruction script/provenance, not bulk third-party source text.\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          if status!='PASS_SOURCE_POOL_OVERSUPPLIED': raise SystemExit(3)
          PY
      - name: Upload source pool build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plm-fresh-sourcepool-build
          path: work/out/
          retention-days: 7
