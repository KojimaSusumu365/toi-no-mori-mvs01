name: QF deterministic Review Gate

on:
  workflow_run:
    workflows: ["QF Claude technical review"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  gate:
    if: >-
      vars.QF_AI_PHASE == 'A' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qf-claude-technical-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: transport
      - name: Resolve current PR, tree, default branch and real Check Runs
        id: live
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            const request=JSON.parse(fs.readFileSync('transport/review-request.json','utf8'));
            const pr=(await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:request.pr_number})).data;
            if (pr.head.repo.full_name!==`${context.repo.owner}/${context.repo.repo}`) return core.setFailed('external head');
            if (pr.head.sha!==request.head_sha) return core.setFailed('stale PR head');
            const commit=(await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:pr.head.sha})).data;
            if (commit.commit.tree.sha!==request.tree_sha) return core.setFailed('tree mismatch');
            const registry=JSON.parse(fs.readFileSync('.github/ai/registries/required-checks.yml','utf8'));
            const expected=new Set(registry.required_checks.map(x=>x.check_name));
            const workOrderPath=`docs/governance/work-orders/${request.work_order_id}.yml`;
            if (!fs.existsSync(workOrderPath)) return core.setFailed(`missing Work Order: ${workOrderPath}`);
            const workOrder=JSON.parse(fs.readFileSync(workOrderPath,'utf8'));
            const workOrderChecks=new Set(workOrder.spec?.required_tests || []);
            if (expected.size!==workOrderChecks.size || [...expected].some(name=>!workOrderChecks.has(name))) return core.setFailed('Work Order / required-check registry drift');
            const runs=await github.paginate(
              github.rest.checks.listForRef,
              {owner:context.repo.owner,repo:context.repo.repo,ref:pr.head.sha,filter:'latest',per_page:100},
              response=>response.data.check_runs,
            );
            const selected={};
            for (const run of runs) if (expected.has(run.name)) selected[run.name]={conclusion:run.conclusion,head_sha:run.head_sha,check_run_id:run.id};
            fs.writeFileSync('transport/checks.json',JSON.stringify(selected,null,2)+'\n');
            const defaultBranch=(await github.rest.repos.get({owner:context.repo.owner,repo:context.repo.repo})).data.default_branch;
            const defaultRef=(await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:defaultBranch})).data.commit.sha;
            core.setOutput('head_sha',pr.head.sha);
            core.setOutput('tree_sha',commit.commit.tree.sha);
            core.setOutput('default_sha',defaultRef);
      - name: Verify structured review and exact identity
        env:
          CLAUDE_EXIT: ${{ github.event.workflow_run.conclusion == 'success' && '0' || '1' }}
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
          TREE_SHA: ${{ steps.live.outputs.tree_sha }}
          DEFAULT_SHA: ${{ steps.live.outputs.default_sha }}
        run: |
          base_drift=()
          reviewed_default="$(python3 -c 'import json; print(json.load(open("transport/technical-review.json"))["default_branch_sha"])')"
          if [[ "$reviewed_default" != "$DEFAULT_SHA" ]]; then base_drift=(--base-drift); fi
          python3 scripts/qf-ai-controller.py --output artifacts/automation/review-gate.json review-gate --request transport/review-request.json --review transport/technical-review.json --checks transport/checks.json --head-sha "$HEAD_SHA" --tree-sha "$TREE_SHA" --default-branch-sha "$DEFAULT_SHA" --claude-exit-code "$CLAUDE_EXIT" "${base_drift[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: qf-review-gate
          path: |
            artifacts/automation/review-gate.json
            transport/technical-review.json
            transport/review-request.json
          if-no-files-found: error
          retention-days: 7
